<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#e60000">
<title>Vodafone Cash — قائمة الأرقام</title>
<style>
  :root { --red:#e60000; --ink:#172033; --line:#cbd2dc; --bg:#f4f6f9; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font-family:Tahoma,Arial,sans-serif; }
  header { background:var(--red); color:#fff; text-align:center; padding:14px 8px; font-size:clamp(21px,5vw,30px); font-weight:800; }
  main { width:100%; max-width:900px; margin:10px auto; padding:0 5px 20px; }
  .hint { background:#fff; border:1px solid var(--line); border-radius:12px; padding:12px 14px; margin-bottom:12px; line-height:1.7; }
  .table-wrap { width:100%; overflow:hidden; background:#fff; border:1px solid var(--line); border-radius:10px; box-shadow:0 3px 12px #14213d0d; }
  table { width:100%; border-collapse:collapse; table-layout:fixed; min-width:0; }
  td { padding:10px 4px; border-bottom:1px solid var(--line); vertical-align:middle; }
  tr:last-child td { border-bottom:0; }
  .num { width:8%; text-align:center; }
  .badge { display:inline-flex; align-items:center; justify-content:center; width:34px; height:34px; border-radius:50%; background:#111; color:white; font-size:16px; font-weight:900; }
  .name { width:42%; padding-right:8px; direction:auto; unicode-bidi:plaintext; text-align:left; font-size:clamp(11px,3.2vw,16px); line-height:1.25; font-weight:700; white-space:nowrap; overflow:visible; letter-spacing:-.25px; }
  .name.long { font-size:clamp(8.5px,2.35vw,11.5px); letter-spacing:-.35px; }
  .phone-cell { width:50%; direction:ltr; text-align:left; white-space:nowrap; position:relative; padding-right:70px; }
  .phone-num { display:inline-flex; align-items:center; justify-content:center; width:30px; height:30px; border-radius:50%; background:#111; color:#fff; font-weight:900; font-size:15px; margin-right:3px; vertical-align:middle; }
  .phone { font-size:clamp(14px,3.8vw,18px); font-weight:800; color:var(--red); letter-spacing:-.25px; }
  button { border:0; border-radius:7px; background:var(--red); color:#fff; padding:8px 11px; font-size:15px; line-height:1.1; font-weight:800; cursor:pointer; margin:0; min-width:52px; box-shadow:0 1px 3px #0002; vertical-align:middle; position:absolute; right:-2px; top:50%; transform:translateY(-50%); }
  button:active { transform:scale(.98); }
  .copy-all { width:100%; margin:0 0 8px; padding:9px; font-size:13px; }
  .footer { color:#5b6472; font-size:12px; text-align:center; padding-top:14px; }
  @media(max-width:380px) {
    td { padding:8px 2px; }
    .badge { width:31px; height:31px; font-size:14px; }
    .name { font-size:clamp(10px,3vw,12px); }
    .name.long { font-size:clamp(8px,2.15vw,9.5px); }
    .phone { font-size:clamp(12px,3.5vw,14px); }
    .phone-num { width:27px; height:27px; font-size:13px; }
    button { padding:7px 8px; font-size:13px; min-width:46px; right:-2px; }
    .phone-cell { padding-right:60px; }
    .name { padding-right:6px; }
  }
</style>
</head>
<body>
<header>Vodafone Cash</header>
<main>
  <div class="hint">اختار الرقم واضغط <b>نسخ</b> علشان تنسخه بسهولة.</div>
  <div class="table-wrap">
    <table aria-label="Vodafone Cash contacts">
      <tbody id="rows"></tbody>
    </table>
  </div>
  <div class="footer">قائمة أرقام Vodafone Cash</div>
</main>
<script>
const contacts = [
  ["Emad H**** M*******", "01011840008"],
  ["Yasmeen S*** A****", "01018976272"],
  ["Mahmoud H****", "01019210324"],
  ["Emad H**** M****** D****** E*****", "01060457601"],
  ["Nagat i***** A** E********", "01023318599"],
  ["أحمد ح****", "01066615668"],
  ["محمد ع**", "01557700670"],
  ["Ahmed A***A**H", "01038302925"],
  ["محمود حالسيد", "01092805503"],
  ["بسيوني ا***ا***", "01111898066"],
  ["Amr Z****A****", "01029174233"],
  ["نهله ب****ز*****", "01032210637"],
  ["محمد ع**م*****", "01091500225"],
  ["Mohamed A**", "01042756810"],
  ["Mahmoud A*********", "01043095082"],
  ["Mahmoud A*********", "01043057684"],
  ["Ahmed h*****M", "01039593127"],
  ["Ahmed h*****M", "01039592732"],
  ["hend G**G**S", "01040291310"],
  ["hend G**G**S", "01040980613"],
  ["hend G**G**S", "01093455276"],
  ["Mohamed M***M***E", "01092406617"],
  ["Mohamed M***M***E", "01010519662"]
];
const tbody = document.getElementById("rows");
contacts.forEach(([name, phone], i) => {
  const tr = document.createElement("tr");
  const n = document.createElement("td"); n.className = "num";
  const badge = document.createElement("span"); badge.className = "badge"; badge.textContent = i + 1; n.appendChild(badge);
  const nm = document.createElement("td"); nm.className = "name" + (name.length > 22 ? " long" : ""); nm.textContent = name;
  const ph = document.createElement("td"); ph.className = "phone-cell";
  const phoneIndex = document.createElement("span"); phoneIndex.className = "phone-num"; phoneIndex.textContent = i + 1;
  const span = document.createElement("span"); span.className = "phone"; span.textContent = phone;
  const btn = document.createElement("button"); btn.type = "button"; btn.textContent = "نسخ";
  btn.addEventListener("click", async () => {
    try { await navigator.clipboard.writeText(phone); btn.textContent = "اتنسخ ✓"; }
    catch(e) { const t = document.createElement("textarea"); t.value = phone; document.body.appendChild(t); t.select(); document.execCommand("copy"); t.remove(); btn.textContent = "اتنسخ ✓"; }
    setTimeout(() => btn.textContent = "نسخ", 1300);
  });
  ph.append(phoneIndex, span, btn); tr.append(n, nm, ph); tbody.appendChild(tr);
});
</script>
</body>
</html>
